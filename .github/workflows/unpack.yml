name: Unpack source
on:
  push:
    branches: [main]
    paths: ['oneline-source.tar.gz']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          tar xzf oneline-source.tar.gz
          rm oneline-source.tar.gz
          git config user.name "Brian Kershner"
          git config user.email "brianwkershner@gmail.com"
          git add -A
          git commit -m "OneLine v1.0: one-line-a-day journal (unpacked source)"
          git push
